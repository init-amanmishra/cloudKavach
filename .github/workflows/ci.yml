# Runs on every push and pull request. Each job is one layer of checks; all must pass.
# Actions are pinned to commit SHAs and tools to exact versions, so a new release can't change the pipeline silently.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # same as the Lambda runtime
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest
        working-directory: backend
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Check web app syntax
        run: node --check frontend/app.js && node --check frontend/config.js

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not only the latest
      - name: Install gitleaks and verify its checksum
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLO "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - run: ./gitleaks git . --redact --no-banner --verbose

  code:
    name: Code scan (Semgrep, Bandit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # show findings in the repository's Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.177.0 bandit==1.9.4
      - name: Semgrep (Python, JavaScript and OWASP Top 10 rules)
        run: >
          semgrep scan --error --metrics off
          --config p/python --config p/javascript --config p/owasp-top-ten
          --sarif-output semgrep.sarif
          backend/cloudkavach backend/cli.py frontend/app.js
      - name: Bandit (Python security linter)
        run: bandit -r backend/cloudkavach backend/cli.py
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  dependencies:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r backend/requirements-dev.txt

  infra:
    name: Infrastructure (Terraform, Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.5
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install checkov==3.3.19
      # Accepted exceptions are written next to each resource as #checkov:skip=ID:reason.
      - name: Checkov (Terraform and the CloudFormation access-role template)
        run: >
          checkov -d . --framework terraform cloudformation --quiet --compact
          -o cli -o sarif --output-file-path console,checkov.sarif
      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        if: always() && hashFiles('infra/checkov.sarif') != ''
        with:
          sarif_file: infra/checkov.sarif
          category: checkov
