# OWASP ZAP baseline scan of the live site: passive only (it reads responses, it doesn't attack).
# Runs weekly and on demand, because it checks what is deployed rather than what is in the repo.
name: DAST (OWASP ZAP)

on:
  schedule:
    - cron: "30 3 * * 1" # Mondays 09:00 IST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  zap:
    name: ZAP baseline scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://d8uec0cg538xi.cloudfront.net
          allow_issue_writing: false # the report is kept as a workflow artifact
